name: CI
on:
  push: { branches: [main] }
  pull_request:

# Least privilege, stated rather than inherited. This workflow reads the repository and
# nothing else; without the block the token's scopes come from the repository default,
# which an org-level change can widen underneath it.
permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with: { configFile: .commitlintrc.yml }

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: kfx
          POSTGRES_PASSWORD: kfx
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pgsql, redis, zip, intl, pcntl
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        with: { node-version: '22', cache: 'npm' }
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install Node dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint (eslint)
        run: npm run lint:check
      - name: Format check (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan --no-progress
      - name: Tests (Pest)
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: kfx
          DB_PASSWORD: kfx
          # Cache/queue stay on phpunit.xml's array/sync — the suite is validated
          # against those; forcing redis here leaks state across tests and breaks
          # auth tests (rate limiter / cached state).
