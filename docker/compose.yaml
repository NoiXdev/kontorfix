services:
  app:
    image: harbor.cloud.noidee.dev/noixdev/kontorfix:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Inlined into the JS bundle at build time, so they belong here and not under
      # `environment` — rebuild the image after changing them.
      args:
        VITE_APP_NAME: ${APP_NAME:-Kontorfix}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${REVERB_HOST:-}
        VITE_REVERB_PORT: ${REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-https}
    ports: ['8080:8080']
    env_file: .env
    environment:
      CONTAINER_ROLE: app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/up']
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - artifacts:/app/storage/app
    restart: unless-stopped

  worker:
    image: harbor.cloud.noidee.dev/noixdev/kontorfix:latest
    environment:
      CONTAINER_ROLE: worker
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - artifacts:/app/storage/app
    restart: unless-stopped

  scheduler:
    image: harbor.cloud.noidee.dev/noixdev/kontorfix:latest
    environment:
      CONTAINER_ROLE: scheduler
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  reverb:
    image: harbor.cloud.noidee.dev/noixdev/kontorfix:latest
    environment:
      CONTAINER_ROLE: reverb
    env_file: .env
    ports: ['8081:8080']
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kontorfix
      POSTGRES_USER: kontorfix
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kontorfix']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  artifacts:
