# The four services below run the same image. `:latest` is a MUTABLE tag: what it resolves
# to is decided by the registry at pull time, so a `docker compose pull` re-executes whatever
# is there now — the pull is part of the supply chain, and on a mutable tag it is
# unauthenticated. The release workflow publishes an immutable version tag and signs the
# image by digest (keyless cosign, bound to this repository's workflow identity), so an
# operator can verify what they are about to run and pin it:
#
#   cosign verify docker.io/<namespace>/<image>:vX.Y.Z \
#     --certificate-identity-regexp '^https://github\.com/<owner>/<repo>/\.github/workflows/release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   docker buildx imagetools inspect docker.io/<namespace>/<image>:vX.Y.Z --format '{{.Manifest.Digest}}'
#
# Then replace `:latest` below with `@sha256:<digest>` — every service, same digest. The
# shipped file keeps `:latest` because a digest cannot be committed ahead of the release it
# names, not because pinning is optional for a production deployment.

# Docker's default logging driver is `json-file` with NO limits: every line any container
# writes is appended to a file under /var/lib/docker/containers forever, and the only thing
# that ever truncates it is deleting the container. On a long-lived deployment that is a
# host-disk filler with no warning attached, and it takes the Docker daemon — not just this
# stack — down with it when the partition fills. 10 MB × 5 is 50 MB per container, ~300 MB
# for the whole stack; raise max-file if you need a longer window, max-size if single log
# lines are large (stack traces are).
#
# This has to be repeated per service: `logging` is not something Compose can default.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# The application services below all log to `stderr` (config/logging.php) rather than to a
# file, so their output lands in `docker logs` / Portainer and is subject to the caps above.
# The file channels are wrong here for two independent reasons:
#
#  - storage/logs is not a volume (only storage/app is), so a log file lives in the
#    container's writable layer. It grows unbounded until the container is replaced, and
#    then it is *destroyed* — every Watchtower redeploy silently deletes the log covering
#    the incident that prompted the redeploy.
#  - Adding a volume for it would fix the destruction but not the growth, and would put the
#    logs somewhere an operator has to shell in to read, instead of in the place Portainer
#    already shows.
#
# Set LOG_LEVEL in docker/.env to change verbosity (`info` is a sane production floor;
# config/logging.php defaults to `debug`). See docs/development.md, "Logs".
#
# LOG_CHANNEL is set under each service's `environment:` rather than in docker/.env on
# purpose: `environment:` wins over `env_file:`, so this holds even for an operator whose
# .env still carries the LOG_CHANNEL=stack that .env.example ships.

services:
  app:
    # The image every service runs — the one release.yml builds, pushes and signs by
    # digest. This line used to name a Harbor reference the release pipeline never
    # populated, left over from the scaffolding commit twenty days before that pipeline
    # existed, which is why the header above already told operators to verify a
    # `docker.io/...` image the file itself did not use.
    #
    # KONTORFIX_IMAGE overrides it — that is where a pinned `…@sha256:<digest>` belongs
    # once a release has been verified per the header.
    image: ${KONTORFIX_IMAGE:-docker.io/noixdev/kontorfix:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Inlined into the JS bundle at build time, so they belong here and not under
      # `environment` — rebuild the image after changing them.
      args:
        VITE_APP_NAME: ${APP_NAME:-Kontorfix}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${REVERB_HOST:-}
        VITE_REVERB_PORT: ${REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-https}
    # Deliberately NOT published on the host. The documented deployment (see
    # docs/development.md, "Deployment & hardening") puts Traefik in front, and Traefik
    # reaches this service over the Docker network as `app:8080` — publishing the port
    # as well would expose the app *around* the proxy. Docker installs its own iptables
    # chain for published ports, which a ufw-style host firewall does not cover, so
    # "the host is firewalled" is usually not true for them. A request arriving that way
    # also comes from the Docker gateway, which TRUSTED_PROXIES trusts by default, so an
    # arbitrary client could spoof X-Forwarded-For/-Host.
    #
    # Attach the proxy's network and route to `app:8080` (uncomment the `networks:` at
    # the bottom of this file). For a host-local deployment without a proxy, publish on
    # loopback only: ports: ['127.0.0.1:8080:8080']
    expose: ['8080']
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      LOG_CHANNEL: stderr
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # /up is answered by the same FrankenPHP thread pool that serves everything else, so
    # this check also detects a saturated pool — which is why the mirror lock the registry
    # takes on a cold dist download has a separate, short wait for HTTP callers
    # (kontorfix.mirror_lock_wait_web). tests/Unit/SyncTimingRelationsTest.php asserts that
    # that wait still fits inside interval × retries.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/up']
      interval: 15s
      timeout: 5s
      retries: 5
    # Deliberately NO stop_grace_period here, unlike the worker below, and the consequence
    # is worth writing down rather than leaving implicit: the lazy dist build performs a
    # `git clone --mirror` inline on the request thread while holding the same mirror lock
    # SyncPackage takes. Docker's 10s default therefore SIGKILLs that request on an app
    # redeploy, and the lock stays held for its full 900s TTL. Raising it would make every
    # user-facing redeploy wait for the slowest in-flight clone (minutes), which is the more
    # expensive of the two — a fast restart is worth one mirror being unsyncable for a
    # quarter of an hour. Moving the build off the request thread is the real fix.
    volumes:
      - artifacts:/app/storage/app
    # The second half of docker/php.ini's memory reasoning, and it only makes sense read
    # together with it. `memory_limit` there is 512M — but it is PER REQUEST, therefore per
    # FrankenPHP thread, and FrankenPHP starts 2 × CPU threads (confirmed against this base
    # image: `num_threads: 12` on a 6-CPU container). On an 8-core host that is 16 threads,
    # so the per-request ceiling alone bounds nothing an attacker can reach in parallel: it
    # decides how large ONE request may grow, not how many may grow at once.
    #
    # What this bounds is the BLAST RADIUS, not the attack. Under a flood of concurrent
    # large bodies the container hits this ceiling and Docker restarts it (`restart:
    # unless-stopped` below), instead of the host's OOM killer choosing a victim — which on
    # a single-host deployment is as likely to be Postgres as this container. A dropped
    # container is a bounded, self-healing outage; a killed database is neither.
    #
    # 2g = the app's steady-state footprint (~300M) plus room for a handful of concurrent
    # requests actually parsing a body near post_max_size. RAISE IT if the host is large and
    # busy — the failure mode of a value set too low is that a legitimate traffic spike
    # restarts the container, which is worse than the attack it guards against. For a HARD
    # bound rather than a blast radius, pin the thread count instead: this image reads
    # FRANKENPHP_CONFIG into the Caddyfile's `frankenphp` block, so `FRANKENPHP_CONFIG:
    # num_threads=8` makes the worst case 8 × 512M and turns the arithmetic above into a
    # decision rather than a function of whatever CPU count the host happens to have.
    mem_limit: 2g
    restart: unless-stopped

  worker:
    image: ${KONTORFIX_IMAGE:-docker.io/noixdev/kontorfix:latest}
    environment:
      CONTAINER_ROLE: worker
      LOG_CHANNEL: stderr
    logging: *logging
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # SyncPackage keeps the git mirrors under storage/app/vcs and writes package
    # artifacts, so the worker needs the same volume the app serves them from.
    volumes:
      - artifacts:/app/storage/app
    # Docker's default is 10 seconds: SIGTERM, then SIGKILL. `php artisan horizon` is PID 1
    # here, so on every redeploy that SIGKILLed whatever a worker was doing ten seconds in.
    # For SyncPackage that means killing a `git clone --mirror` while it holds the mirror
    # lock — and the kill leaves the lock held for its full 900s TTL, wedging that package
    # for fifteen minutes after a routine deploy.
    #
    # 930s = SyncPackage::TIMEOUT (900, also the largest supervisor timeout, which is what
    # MasterSupervisor::terminate() waits for) plus a little. Horizon exits as soon as its
    # supervisors are done, so an idle worker still stops in seconds; only a worker with a
    # sync genuinely in flight makes a deploy wait, and only for as long as that sync had
    # left. Lower it if a bounded deploy time matters more than an unwedged mirror — that is
    # the whole trade.
    #
    # It does not make the kill impossible. `docker kill`, an OOM kill and host failure all
    # still take a holder out; GitRepository::LOCK_TTL is what bounds the damage then.
    stop_grace_period: 930s
    restart: unless-stopped

  scheduler:
    image: ${KONTORFIX_IMAGE:-docker.io/noixdev/kontorfix:latest}
    environment:
      CONTAINER_ROLE: scheduler
      LOG_CHANNEL: stderr
    logging: *logging
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # `upstream-cache:prune` (routes/console.php) deletes files under
    # storage/app/artifacts/proxy, and this is the only service that runs the schedule.
    # Without the volume it iterates the image's own empty directory, reports "0 removed"
    # and the proxy cache stays at its budget for good — while the byte accounting, which
    # lives in the shared Redis, keeps looking healthy. The command warns when it sees
    # that mismatch, but the mount is what prevents it.
    volumes:
      - artifacts:/app/storage/app
    restart: unless-stopped

  reverb:
    image: ${KONTORFIX_IMAGE:-docker.io/noixdev/kontorfix:latest}
    # Opt-in, exactly like the broadcasting block in .env.example that it needs:
    #   docker compose --profile reverb up -d
    # Without the profile this service is not created at all. `docker/.env.example` ships
    # BROADCAST_CONNECTION commented out, so the stock instance runs the `null` driver and
    # `reverb:start` can only refuse (ReverbConfigGuard) — which under a restart policy is
    # an invisible, permanent crash loop next to a registry that looks perfectly healthy.
    profiles: ['reverb']
    environment:
      CONTAINER_ROLE: reverb
      LOG_CHANNEL: stderr
    logging: *logging
    env_file: .env
    # No volume on purpose: `reverb:start` only relays websocket frames via Redis and
    # never reads or writes storage/app. Channel authorization happens in the app service.
    # Same reasoning as the app service: the websocket goes through the proxy too
    # (`reverb:8080`). Host-local alternative: ports: ['127.0.0.1:8081:8080']
    expose: ['8080']
    depends_on:
      redis: { condition: service_healthy }
    # Not `unless-stopped`: a refused start is a configuration error, and restarting it
    # forever is what kept the last one invisible. Five attempts, then the container stays
    # down with the reason in its logs and on the operator health page.
    restart: on-failure:5

  # The vulnerability scanner. Its own service rather than a binary inside the app image:
  # the vulnerability database lives in its own volume, the app image stays slim, and a scan
  # that hangs cannot take the web service with it.
  #
  # It speaks the Harbor Pluggable Scanner Adapter API, so any adapter-compatible scanner can
  # take its place — set KONTORFIX_SCANNER_IMAGE. `aquasec/harbor-scanner-trivy` is the
  # community build of the same adapter Harbor ships as `goharbor/trivy-adapter-photon`;
  # there is no functional difference between them.
  #
  # `:0.31.4` below is a PIN, not a moving tag, for the same reason the header of this file
  # pins the first-party image: every vulnerability verdict this feature ever produces comes
  # from whatever this line resolves to, so `docker compose pull` must not silently swap that
  # component. KONTORFIX_SCANNER_IMAGE overrides it — set it to a newer release tag, or to
  # `…@sha256:<digest>` once you have verified one, the same as KONTORFIX_IMAGE at the top of
  # this file. If you bump the version, re-check SCANNER_TRIVY_SECURITY_CHECKS below against
  # that release's own config (pkg/etc/config.go in aquasecurity/harbor-scanner-trivy): it was
  # renamed to SCANNER_TRIVY_SCANNERS in some later Trivy-adapter lineages, and a rename this
  # file has not followed is silently ignored rather than refused.
  #
  # THE ADAPTER PULLS THE IMAGE FROM US. It reaches the registry at `app:8080` over this
  # network — which is why KONTORFIX_SCANNER_REGISTRY_URL exists and is not APP_URL — and it
  # presents a short-lived, read-only token minted per scan for exactly one registry.
  #
  # It also needs OUTBOUND internet access to fetch the Trivy vulnerability database from
  # ghcr.io. On an air-gapped host, mirror the database and set SCANNER_TRIVY_DB_REPOSITORY;
  # a scanner that cannot update reports reassuring zeros, which the health page's
  # "Aktualität der Prüfungen" check exists to catch.
  scanner:
    image: ${KONTORFIX_SCANNER_IMAGE:-aquasec/harbor-scanner-trivy:0.31.4}
    environment:
      SCANNER_API_SERVER_ADDR: ':8080'
      # Database 2 — neither index this stack's own Laravel connections default to.
      # config/database.php's `default` connection (REDIS_DB, unset = 0) carries the queue
      # (config/queue.php's redis connection defaults to it), Horizon (config/horizon.php:
      # `'use' => 'default'`), the session store when SESSION_DRIVER=redis (its own
      # `connection` is unset, which falls through to `default`), and Reverb's broadcasting
      # (config/reverb.php reads REDIS_DB too). config/database.php's `cache` connection
      # (REDIS_CACHE_DB, unset = 1) carries CACHE_STORE=redis, the docker/.env.example
      # default. 0 and 1 are therefore both spoken for before this service exists — giving
      # the adapter a namespace of its own on 2 means a database-level operation against any
      # one of these (FLUSHDB, a backup, a migration) cannot also wipe or block on another's
      # keys. The key prefixes already differ in normal operation; this is what keeps that
      # true under maintenance too.
      SCANNER_REDIS_URL: redis://redis:6379/2
      # Vulnerabilities only. The adapter's default (`vuln,config,secret`) also runs
      # misconfiguration and secret detection, which this feature stores nothing from —
      # paying for it would be slower scans for results nobody reads. Verified against
      # v0.31.4's own pkg/etc/config.go, which still reads this exact name — see the pin
      # comment above before changing KONTORFIX_SCANNER_IMAGE.
      SCANNER_TRIVY_SECURITY_CHECKS: vuln
      SCANNER_LOG_LEVEL: ${SCANNER_LOG_LEVEL:-info}
    # Not published on the host, like `app`: it is reached over this network by name, and
    # its API is unauthenticated by design — it is meant to sit behind the thing that calls
    # it. Publishing it would hand anyone who can reach the host an image-pull oracle.
    expose: ['8080']
    logging: *logging
    depends_on:
      redis: { condition: service_healthy }
    # The adapter's own liveness probe (GET /probe/healthy, HTTP 200 when up), not a
    # reinvented check — nothing `depends_on` this service, so without this the container
    # could start and immediately die with no Docker-level signal at all, only a red
    # "Schwachstellen-Scanner" health check minutes later. `wget` rather than `curl`: the
    # runtime image is Trivy's own (`aquasec/trivy`), which is Alpine-based and ships
    # BusyBox's `wget` but not `curl`.
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/probe/healthy']
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - trivycache:/home/scanner/.cache
    mem_limit: 1g
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kontorfix
      POSTGRES_USER: kontorfix
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    logging: *logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kontorfix']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *logging
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  artifacts:
  trivycache:
# Attach the reverse proxy's network so it can route to `app:8080` / `reverb:8080`
# without any port being published on the host. Uncomment and name the proxy network:
#
# networks:
#   default:
#   proxy:
#     external: true
#
# …then add `networks: [default, proxy]` to the `app` and `reverb` services.
