name: kontorfix-e2e

# Shared by app and worker so the two cannot drift. KONTORFIX_VCS_* are the documented
# operator escape hatches for a self-hosted git server on a private network
# (config/kontorfix.php): `gitserver` resolves to a Docker-internal address and speaks
# git://, and GitUrlSafety refuses both by default. They are set here rather than being
# bypassed in code so the guard stays in force for every other host.
x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: 'true'
  APP_KEY: ${E2E_APP_KEY:?set by bin/e2e — run the stack through it}
  APP_URL: http://app:8080
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_DATABASE: kontorfix
  DB_USERNAME: kontorfix
  DB_PASSWORD: e2e
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  BROADCAST_CONNECTION: 'null'
  LOG_CHANNEL: stderr
  KONTORFIX_VCS_ALLOWED_SCHEMES: https,ssh,git
  KONTORFIX_VCS_ALLOWED_HOSTS: gitserver

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kontorfix-e2e:local
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    # Loopback only. The clients reach the app as `app:8080` over the compose network;
    # this publication exists so a human can look at a failing stack.
    ports: ['127.0.0.1:8099:8080']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/up']
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - artifacts:/app/storage/app

  worker:
    image: kontorfix-e2e:local
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    depends_on:
      app: { condition: service_healthy }
    # The base image (dunglas/frankenphp) bakes a HEALTHCHECK that curls the Caddy admin
    # API on :2019. That is correct for the `app` role but this container execs
    # `php artisan horizon` instead (docker/entrypoint.sh) and never listens there, so the
    # inherited check fails forever — `docker compose up --wait` waits on every container
    # with a healthcheck, not just ones another service depends on, and exits non-zero the
    # moment one is unhealthy. Disabling it here doesn't hide a real failure: nothing in
    # this stack gates on the worker being "healthy", and Horizon's own liveness is what
    # the client tests exercise indirectly by waiting on sync results.
    healthcheck:
      disable: true
    # The same volume the app serves artifacts from — SyncPackage writes the git mirror
    # and the built dist here.
    volumes:
      - artifacts:/app/storage/app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kontorfix
      POSTGRES_USER: kontorfix
      POSTGRES_PASSWORD: e2e
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kontorfix']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  gitserver:
    build:
      context: e2e/gitserver
    volumes:
      - ../tests/E2E/fixtures/composer-package:/fixture:ro

  # The four clients are shells the tests reach into, not services. client-docker is the
  # odd one of the four: it does not run its own Docker daemon (docker-in-docker), it is a
  # bare `docker` CLI pointed at the HOST's socket (see the bind mount below). Every
  # `docker build/login/push/pull` tests/E2E/DockerTest.php runs through it is therefore
  # executed by the SAME daemon `bin/e2e` itself already runs `docker compose` against —
  # Docker Desktop's daemon on a developer machine, or the runner's daemon in CI — not by
  # an isolated daemon inside this container. That is what makes the plaintext-to-127.0.0.1
  # exception apply at all (see DockerTest.php's own docblock): the push/pull request
  # leaves from that daemon's own network stack, at the exact loopback address `app`
  # already publishes on, exactly as if a developer had typed the same command in a host
  # shell. The corollary is that images and layers this container builds or pulls are NOT
  # torn down by `bin/e2e`'s teardown() (which only removes this compose project, not the
  # shared daemon's image store) — DockerTest.php removes the specific tags it creates
  # itself in an afterAll().
  client-docker:
    image: docker:27-cli
    entrypoint: ['sleep', 'infinity']
    working_dir: /work
    volumes:
      - ../tests/E2E/fixtures:/fixtures:ro
      - /var/run/docker.sock:/var/run/docker.sock

  client-composer:
    image: composer:2
    entrypoint: ['sleep', 'infinity']
    working_dir: /work
    volumes:
      - ../tests/E2E/fixtures:/fixtures:ro

  client-npm:
    image: node:22-alpine
    entrypoint: ['sleep', 'infinity']
    working_dir: /work
    volumes:
      - ../tests/E2E/fixtures:/fixtures:ro

  client-python:
    build:
      context: e2e/python-client
    entrypoint: ['sleep', 'infinity']
    working_dir: /work
    volumes:
      - ../tests/E2E/fixtures:/fixtures:ro

volumes:
  artifacts:
