; The FrankenPHP base image ships no php.ini of its own (confirmed: `php -i` inside
; dunglas/frankenphp reports "Loaded Configuration File => (none)"), so without this file
; PHP falls back to its compiled-in defaults — post_max_size=8M among them.
;
; The OCI blob push path (App\Http\Controllers\Registry\Oci\BlobController::append()/
; finish(), backed by App\Services\Oci\BlobStore) already streams a chunk's bytes straight
; through `$request->getContent(asResource: true)` without ever buffering the whole body
; in userland PHP. That does not help against post_max_size: PHP's own request-startup
; code refuses to make the body available at all once Content-Length exceeds it, before
; the controller — or anything else in the framework — ever runs. A layer above that
; size, which is exactly the case Task 7's 500 MiB gate (spec §4) exists to prove works, is
; rejected regardless of how carefully the code that would have read it behaves.
;
; 0 is PHP's own documented spelling of "no limit" for post_max_size specifically (unlike
; upload_max_filesize, where 0 means the opposite — see below).
;
; This value is GLOBAL and UNSCOPED — it applies to every route PHP ever sees, not only
; `/v2/...` — so it must never again be the only thing standing between an unauthenticated
; request and PHP buffering an arbitrarily large body. The first version of this file left
; it at 0 without anything else in front of it: an anonymous multipart POST to `/login`,
; `/forgot-password` or `/setup` could then make PHP write gigabytes onto the container's
; disk before Laravel was ever reachable to reject it.
;
; docker/Caddyfile is what scopes the DECLARED-length case: it rejects a request outside
; `/v2/*` whose Content-Length exceeds 256 MiB, in front of PHP, before this 0 is ever
; reached. That file's own comment explains, at length, why the obvious-looking Caddy
; directive for this (`request_body { max_size ... }`) does NOT work with FrankenPHP's
; `php_server` handler, and — just as important — why nothing at the Caddy layer can see a
; CHUNKED body at all (Go's net/http strips Transfer-Encoding before Caddy ever evaluates a
; matcher). For that shape, `memory_limit` and `max_file_uploads` below are the real
; backstop, not this setting: confirmed directly that post_max_size only ever produces a
; warning for method POST and nothing whatsoever for PUT/PATCH, never truncating a read
; either way, chunked or not. Do not rely on this file's post_max_size alone to bound
; request bodies; see docker/Caddyfile's own comment for the full story of what actually
; does, and read memory_limit's comment below before assuming a low post_max_size is doing
; any work here that it is not.
post_max_size = 0

; Irrelevant to the OCI push path above (a blob arrives as a raw application/octet-stream
; body, never as a multipart file upload — $_FILES is never populated for it), but this
; DOES gate the one real multipart upload this app has: twine's wheel/sdist upload
; (App\Services\Python\PythonPublishService, behind PypiController). That service already
; enforces its own ceiling in application code — `kontorfix.python_max_dist_bytes`,
; defaulting to 200 MiB — so this is set to comfortably clear that default (not to some
; arbitrary large number) precisely so PHP is never the layer that discovers a body-size
; limit before Laravel's own configured one gets a chance to answer with a proper error
; instead of a silently truncated upload. Raise this together with
; `kontorfix.python_max_dist_bytes` if that default is ever raised, not on its own.
upload_max_filesize = 256M

; Pinned explicitly rather than left at whatever the base image happens to compile in
; (128M, confirmed via `php -i`) — this is not a leftover default, it is the mechanism that
; actually bounds an anonymous, undeclared-length (chunked) request body, which nothing at
; the Caddy layer can even see (docker/Caddyfile's own comment has the full investigation).
; PHP parses `application/x-www-form-urlencoded` — the shape a real login form actually
; submits — into $_POST unconditionally during request bootstrap, before any Laravel code
; runs, REGARDLESS of chunking; confirmed directly by sending a 500 MiB chunked urlencoded
; body to a route that never once reads $_POST and getting a clean PHP Fatal ("Allowed
; memory size ... exhausted") at exactly this value, not at any post_max_size-related
; boundary. Any OTHER content type PHP does not auto-parse (raw JSON, octet-stream, the
; shape an OCI push actually is) is never read at all unless application code explicitly
; asks for it — confirmed the same way, with an instant clean response for a 500 MiB body
; nothing ever touched — so this value has no bearing on a legitimate large OCI layer,
; which this app's own controllers only ever read AFTER authenticating the request.
memory_limit = 128M

; Multipart uploads are hard-capped PER FILE by upload_max_filesize regardless of chunking
; (PHP's own multipart parser enforces it while parsing — confirmed: a 30 MiB chunked
; upload against a 20 MiB test cap came back as $_FILES[...]['error'] ===
; UPLOAD_ERR_INI_SIZE, size 0, nothing ever written to a temp file), but that cap is PER
; FILE — the base image's default of 20 simultaneous file fields would let a client
; multiply it by twenty. Nothing in this app sends more than one file per request (twine
; uploads exactly one wheel/sdist per call — see PypiController::upload()'s single
; $request->file('content')), so there is no reason to allow more.
max_file_uploads = 1
