; The FrankenPHP base image ships no php.ini of its own (confirmed: `php -i` inside
; dunglas/frankenphp reports "Loaded Configuration File => (none)"), so without this file
; PHP falls back to its compiled-in defaults — post_max_size=8M among them.
;
; The OCI blob push path (App\Http\Controllers\Registry\Oci\BlobController::append()/
; finish(), backed by App\Services\Oci\BlobStore) already streams a chunk's bytes straight
; through `$request->getContent(asResource: true)` without ever buffering the whole body
; in userland PHP. That does not help against post_max_size: PHP's own request-startup
; code refuses to make the body available at all once Content-Length exceeds it, before
; the controller — or anything else in the framework — ever runs. A layer above that
; size, which is exactly the case Task 7's 500 MiB gate (spec §4) exists to prove works, is
; rejected regardless of how carefully the code that would have read it behaves.
;
; 0 is PHP's own documented spelling of "no limit" for post_max_size specifically (unlike
; upload_max_filesize, where 0 means the opposite — see below). Left uncapped rather than
; pinned to some larger-but-still-finite number: a registry that stores container images
; cannot know in advance how large the largest layer a client will ever push actually is,
; and BlobStore's append/hash/promote path is already linear in the blob's own size, not in
; any limit declared here — so a cap at this layer protects nothing once the code path
; itself never buffers the request body wholesale.
post_max_size = 0

; Irrelevant to the push path above (an OCI blob arrives as a raw application/octet-stream
; body, never as a multipart file upload — $_FILES is never populated for it), but raised
; well past PHP's own 2M default anyway, and comfortably past post_max_size = 0 no longer
; constraining it either: the one real multipart upload in this app
; (App\Services\Python\PythonPublishService, behind PypiController) should never be the
; thing that discovers this instance has a body-size ceiling the OCI registry does not.
upload_max_filesize = 2G
