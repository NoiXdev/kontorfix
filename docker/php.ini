; The FrankenPHP base image ships no php.ini of its own (confirmed: `php -i` inside
; dunglas/frankenphp reports "Loaded Configuration File => (none)"), so without this file
; PHP falls back to its compiled-in defaults — post_max_size=8M among them.
;
; The OCI blob push path (App\Http\Controllers\Registry\Oci\BlobController::append()/
; finish(), backed by App\Services\Oci\BlobStore) already streams a chunk's bytes straight
; through `$request->getContent(asResource: true)` without ever buffering the whole body
; in userland PHP. post_max_size does NOT stand in its way, chunked or declared-length,
; monolithic POST or chunked PATCH — confirmed directly against this image: a 40 MiB and a
; 200 MiB `application/octet-stream` body, sent both with a declared Content-Length and as
; a real chunked Transfer-Encoding, arrived at `php://input` byte-for-byte complete with
; `post_max_size` set to a fraction of either size. PHP's post_max_size check governs only
; whether it auto-populates `$_POST`/`$_FILES`; it never gates a raw stream read that
; application code asks for itself, which is exactly the shape an OCI push always is.
;
; THIS FILE PREVIOUSLY GOT THIS BACKWARDS, and the mistake shipped a Critical: it set
; post_max_size to 0 ("no limit" — PHP's own documented spelling for this directive,
; unlike upload_max_filesize below, where 0 means the opposite) on the theory that OCI
; pushes needed it unbounded. They do not (see above) — and 0 here removes the ONE cheap
; guard that keeps PHP from ever attempting to build the request superglobals at all for a
; huge body. With post_max_size unbounded, an `application/x-www-form-urlencoded` POST (a
; real login form's actual shape, reachable by anyone, no auth required) is parsed into
; `$_POST` unconditionally during PHP's request bootstrap — before Laravel, before
; `HandleExceptions`, before anything that could turn a failure into a normal HTTP
; response — bounded only by memory_limit. Hitting memory_limit during THIS specific
; early phase does not surface as `HandleExceptions` normally would: confirmed directly,
; two 40 MiB anonymous POSTs to `/up` against `post_max_size=0`/`memory_limit=128M` were
; enough to take the FrankenPHP process down (exited/139) — the same probe against a
; pre-php.ini image (compiled-in post_max_size=8M) survived four. `restart:
; unless-stopped` in docker/compose.yaml makes that repeatable by anyone, unauthenticated,
; forever.
;
; THE FIX IS post_max_size WELL BELOW memory_limit, and "well below" is a MEASURED
; RATIO rather than a margin that can be eyeballed. Two rounds of measurement, both
; against this image (dunglas/frankenphp:1-php8.4) over a raw socket rather than through a
; client that might reframe the request:
;
; ROUND ONE, at memory_limit = 128M (the base image's compiled-in value, which this file
; originally kept):
;   - 256M — comfortably above every real upload this app configures, and the number a
;     "just raise it" fix would reach for — is NOT enough: a 200 MiB body is UNDER that
;     ceiling, so PHP does not refuse it early and instead attempts to actually build
;     $_POST from it, which is exactly the dangerous path. Confirmed directly, with
;     memory_limit raised in step alongside it (512M, so the same body sat at half the
;     configured ceiling rather than pressed against it): FrankenPHP did not exit this
;     time, but logged "Request startup failed, thread is unhealthy" and served a bare 500.
;   - 32M — below memory_limit by what looks like a comfortable margin, and clean against
;     five 200 MiB DECLARED-length anonymous POSTs — was STILL NOT ENOUGH: reproducibly, on
;     the third of a run of five 200 MiB CHUNKED (Transfer-Encoding, no Content-Length at
;     all) anonymous POSTs. The log at the moment of failure ("PHP Warning: PHP Request
;     Startup: Actual POST length does not match Content-Length, and exceeds 33554432
;     bytes" immediately followed by "PHP Fatal error: Allowed memory size ... exhausted")
;     shows PHP DOES notice the post_max_size overage for a chunked body — but only after
;     it has already grown a buffer large enough, on this one request, to also blow
;     memory_limit, because there is no Content-Length to refuse against up front the way
;     there is for a declared body. 30M and 28M each survived ten runs of both shapes;
;     32M — exactly 2^25 — failed on repeat. That round landed on 24M.
;
; ROUND TWO, this file's current values, run because 24M turned out to be a real product
; constraint and not merely a conservative number: it caps twine's multipart upload at
; 24 MiB (see upload_max_filesize below), far under the 200 MiB this project documents and
; offers as an operator setting. Round one's model — "post_max_size somewhere below
; memory_limit" — is not what the measurement actually supports. THE BINDING SHAPE IS A
; BODY JUST *UNDER* post_max_size, not one far above it: that body is accepted, so PHP
; parses it into $_POST for real, and an `application/x-www-form-urlencoded` body with one
; huge value needs several times its own size in memory to do so.
;   - 512M / 96M FAILS. A 95 MiB chunked body — anonymous, any route, no auth — exhausted
;     memory on the FIRST attempt: "Allowed memory size of 536870912 bytes exhausted
;     (tried to allocate 99614744 bytes)", i.e. PHP was already holding roughly four times
;     the body before it asked for one more buffer of the body's full size, plus the
;     familiar "Request startup failed, thread is unhealthy". Attempts 2-5 of the same run
;     then passed, which makes this WORSE and not milder: it is load- and
;     fragmentation-dependent, so it is not a limit an operator would ever see coming.
;   - 512M / 80M is CLEAN: 55 runs across every shape that has ever produced a failure here
;     — 79 MiB (just under the ceiling, the round-two shape) chunked ×10 and declared ×10,
;     the same size as 1000 separate fields chunked ×5 and declared ×5, 200 MiB (far over
;     the ceiling, the round-one shape) chunked ×10 and declared ×10, and 200 MiB of
;     millions of tiny pairs ×5. No fatal, no unhealthy thread, container healthy
;     throughout.
;   - 768M / 96M is also clean (15 runs), and was rejected anyway: memory_limit is PER
;     REQUEST and therefore per thread, so it multiplies by the thread count on the host.
;     16 MiB more upload headroom is not worth 50% more worst-case memory per concurrent
;     request. docker/compose.yaml caps the container as the second half of that reasoning.
;
; THE RULE THE TWO ROUNDS AGREE ON: memory_limit must be roughly 6.5x post_max_size.
; 512/80 = 6.4x is clean, 512/96 = 5.3x fails; round one's 128/24 = 5.3x looked safe only
; because it was never tested with a body just under its own ceiling. DO NOT round either
; number up without re-running the matrix above — most importantly the "just under the
; ceiling, chunked, one huge value" case, which is the one that fails first and the one
; round one never ran.
;
; This value is GLOBAL and UNSCOPED — it applies to every route PHP ever sees, not only
; `/v2/...` — which is why the shapes above are all sent anonymously to a route that does
; not even read $_POST. post_max_size cannot be raised for one route and not another:
; it is PHP_INI_PERDIR, applied while the request body is parsed, before any application
; code runs, so `ini_set()` in a controller is not an option.
;
; ONE REAL COST REMAINS, measured rather than assumed away: this value also caps twine's
; multipart upload (see upload_max_filesize below) at 80 MiB regardless of
; `upload_max_filesize` or `kontorfix.python_max_dist_bytes` (default 200 MiB,
; docs/development.md and .env.example) — PHP's multipart parser never runs at all once
; the WHOLE post body exceeds post_max_size, independent of any single file's own size,
; which PypiController::upload() then reports as "Missing distribution file": a
; wrong-sounding but harmless 400, not a crash. Round two above raised that ceiling from
; 24 MiB to 80 MiB and did not remove it, because no value that reaches 200 MiB survives
; the measurement at a memory_limit this host can afford per thread. The effective ceiling
; is recorded in docs/development.md and .env.example rather than left for an operator to
; discover by a failed upload. Closing the gap for real means making the PyPI upload path
; stream the way the OCI push path already does, so that nothing has to be buffered into
; $_FILES at all — that is a rewrite of PythonPublishService, not an ini value.
;
; docker/Caddyfile is what scopes the DECLARED-length case for every OTHER route: it
; rejects a request outside `/v2/*` whose Content-Length exceeds 256 MiB, in front of PHP,
; before this file is ever reached. That file's own comment explains, at length, why the
; obvious-looking Caddy directive for this (`request_body { max_size ... }`) does NOT work
; with FrankenPHP's `php_server` handler, and — just as important — why nothing at the
; Caddy layer can see a CHUNKED body at all (Go's net/http strips Transfer-Encoding before
; Caddy ever evaluates a matcher). For THAT shape — the one Caddy structurally cannot
; catch — post_max_size and memory_limit are the only backstop that exists, which is why
; every chunked case above was tested as rigorously as its declared counterpart rather
; than assumed to follow it.
post_max_size = 80M

; Irrelevant to the OCI push path above (a blob arrives as a raw application/octet-stream
; body, never as a multipart file upload — $_FILES is never populated for it), but this
; DOES gate the one real multipart upload this app has: twine's wheel/sdist upload
; (App\Services\Python\PythonPublishService, behind PypiController). That service already
; enforces its own ceiling in application code — `kontorfix.python_max_dist_bytes`,
; defaulting to 200 MiB — so this is set to comfortably clear that default. In practice
; post_max_size above is now the binding ceiling for this upload, not this value — see its
; comment for the measurement — but this is left at the size that actually matches the
; documented default rather than shrunk to match post_max_size's real constraint, so
; raising post_max_size later (should a safe way to do so appear) does not also require
; raising this.
upload_max_filesize = 256M

; RAISED from the base image's compiled-in 128M (confirmed via `php -i`), and the two
; numbers move together or not at all: this is the ceiling post_max_size above is measured
; to sit at 6.4x below, and the one PHP itself enforces while building $_POST from an
; `application/x-www-form-urlencoded` body — the shape a real login form actually submits,
; and the shape that needs several times its own size in memory to parse. Round two of
; post_max_size's measurement is what fixes this value: 80M of post body is only safe with
; 512M here, and lowering this back to 128M without also lowering post_max_size to 24M
; re-opens the exact crash this file exists to close. Any OTHER content type PHP does not
; auto-parse (raw JSON, octet-stream, the shape an OCI push actually is) is never read at
; all unless application code explicitly asks for it — this value has no bearing on it,
; confirmed the same way post_max_size's own comment describes.
;
; THIS VALUE IS PER REQUEST, therefore per FrankenPHP thread, therefore multiplied by the
; thread count on the host — which is why 768M (clean at post_max_size 96M, 15 runs) was
; rejected in favour of this pair, and why docker/compose.yaml now caps the app container's
; memory. A per-request ceiling with no container ceiling behind it does not bound anything
; an attacker can reach in parallel; it only decides how large one request may grow before
; PHP stops it.
memory_limit = 512M

; Multipart uploads are hard-capped PER FILE by upload_max_filesize regardless of chunking
; (PHP's own multipart parser enforces it while parsing — confirmed: a 30 MiB chunked
; upload against a 20 MiB test cap came back as $_FILES[...]['error'] ===
; UPLOAD_ERR_INI_SIZE, size 0, nothing ever written to a temp file), but that cap is PER
; FILE — the base image's default of 20 simultaneous file fields would let a client
; multiply it by twenty. Nothing in this app sends more than one file per request (twine
; uploads exactly one wheel/sdist per call — see PypiController::upload()'s single
; $request->file('content')), so there is no reason to allow more.
max_file_uploads = 1

; OFF, not left at the base image's own default (confirmed via `php -i`: the compiled-in
; default is "STDOUT", not Off — a CLI-SAPI value that, verified directly against this
; image, does NOT mean "the container's own stdout": a 200 MiB anonymous POST at
; post_max_size=256M/memory_limit=128M (the near-ceiling shape post_max_size's own comment
; above measures and rejects) came back HTTP 200 with the literal HTML of
; "<b>Fatal error</b>: Allowed memory size of 134217728 bytes exhausted ... in
; <b>Unknown</b> on line <b>0</b>" as the entire response body. `HandleExceptions`
; (Laravel's own error rendering) never runs for a failure this early — it happens before
; Laravel is reachable at all — so nothing downstream ever gets a chance to turn it into a
; normal response. A docker client expecting a JSON OCI error envelope, or any other
; caller, gets a raw PHP diagnostic instead. Confirmed the same probe with display_errors
; Off comes back a bare, empty-bodied 500.
;
; This value cannot make post_max_size's own fix redundant — it only decides what an
; anonymous caller SEES when that path is reached at all, not whether it is reached — but
; it is not merely cosmetic either: this file's post_max_size is a fixed number, and any
; request this file's authors did not foresee (a future route, a raised limit elsewhere)
; that ever again lands near memory_limit during this early phase should fail as a plain
; 500, not as a stack trace in the response body.
display_errors = Off

; On, so the failure display_errors above hides from the CALLER is not also hidden from
; the OPERATOR. `log_errors` compiles in Off — confirmed via `php -i` — so without this,
; turning display_errors Off would make a request-startup failure invisible everywhere,
; not merely to the client that triggered it. Confirmed directly: with this On, the same
; near-ceiling Fatal from display_errors' own comment appears in FrankenPHP's own
; structured log output (`docker logs`) as "PHP Fatal error: Allowed memory size of ...
; exhausted ... in Unknown on line 0" — reachable by an operator, at the point they would
; already be looking after `restart: unless-stopped` masks a crash as a silent restart.
; error_log is left unset (PHP's own default), which for this SAPI is exactly that
; container-log stream — no separate file to rotate or lose on a container replace.
log_errors = On
